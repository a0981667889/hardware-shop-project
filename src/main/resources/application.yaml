spring:
  flyway:
    enabled: true
    locations: "classpath:db/migration"
  datasource:
    # 課程 Postgres 容器：docker run -d --name my_postgres -e POSTGRES_PASSWORD=my_secret_password -p 5433:5432 postgres:15
    # 資料庫請先建立：docker exec my_postgres psql -U postgres -c "CREATE DATABASE starter_db;"
    url: jdbc:postgresql://localhost:5433/starter_db
    username: postgres
    password: my_secret_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # schema 由 Flyway 管理，Hibernate 只驗證；不要改成 update！
    show-sql: true

jwt:
  # ⚠️ HS256 至少要 32 字元；正式環境改用環境變數注入，不要進 git
  secret: change-me-this-secret-must-be-at-least-256-bits-long!!
  access-token-expiration: 900000       # 15 分鐘（毫秒）
  refresh-token-expiration: 604800000   # 7 天（毫秒）
# application.yml
springdoc:
  api-docs:
    path: /v3/api-docs          # OpenAPI JSON 路徑
  swagger-ui:
    path: /swagger-ui.html      # Swagger UI 存取路徑
    operations-sorter: method   # 按 HTTP Method 排序
    tags-sorter: alpha          # Tag 按字母排序
  # 只掃描指定套件，加快啟動速度
  packages-to-scan: com.example.starter

